<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة تعلّم كلاود</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --navy:#0B3C53; --navy2:#145C76; --teal:#0E7C7B; --teal-l:#E6F2F1;
 --bg:#F6F4EF; --card:#FFFFFF; --ink:#1B2A32; --muted:#64757E;
 --line:#E2DED5; --gold:#C9802B; --ok:#1F7A52; --no:#B23B3B;
}
body{background:var(--bg);color:var(--ink);
 font-family:"Segoe UI","Tahoma",system-ui,sans-serif;line-height:1.85;font-size:16px}
.wrap{display:grid;grid-template-columns:272px 1fr;min-height:100vh;max-width:1240px;margin:0 auto}
/* ---- sidebar ---- */
aside{background:var(--navy);color:#EAF1F4;padding:26px 20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-size:21px;font-weight:700;letter-spacing:.2px;line-height:1.4}
.brand span{display:block;font-size:12.5px;font-weight:400;color:#9FBAC6;margin-top:6px;letter-spacing:1px}
.prog{margin:22px 0 26px}
.bar{height:7px;background:#17506B;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .45s ease}
.prog small{display:block;color:#9FBAC6;font-size:12.5px;margin-top:8px}
nav button{display:block;width:100%;text-align:right;background:none;border:0;color:#CFE0E7;
 padding:11px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:14.5px;margin-bottom:3px;
 border-right:3px solid transparent;transition:.18s}
nav button:hover{background:#114B64;color:#fff}
nav button.on{background:#114B64;color:#fff;border-right-color:var(--teal);font-weight:600}
nav button .d{display:block;font-size:11.5px;color:#8FAEBC;letter-spacing:1px}
nav button.done .d::after{content:" ✓";color:#5FD0A8}
.navsep{height:1px;background:#1B5572;margin:16px 0}
/* ---- main ---- */
main{padding:46px 48px 90px;max-width:860px}
.eyebrow{color:var(--teal);font-size:13px;font-weight:700;letter-spacing:2px;margin-bottom:8px}
h1{font-size:34px;line-height:1.35;color:var(--navy);font-weight:700;margin-bottom:12px}
h2{font-size:21px;color:var(--navy);margin:0 0 10px;font-weight:700}
.goal{background:var(--teal-l);border-right:3px solid var(--teal);padding:14px 18px;border-radius:0 8px 8px 0;
 color:#14484C;margin:18px 0 34px;font-size:15.5px}
.lesson{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px 26px;margin-bottom:18px}
.lhead{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.lnum{background:var(--navy);color:#fff;width:27px;height:27px;border-radius:7px;display:grid;place-items:center;
 font-size:13px;flex:none;margin-top:3px}
.lesson p{margin:11px 0;color:#2B3B44}
.tip{background:#FDF6E9;border:1px solid #F0DFBF;border-radius:9px;padding:12px 15px;margin-top:14px;font-size:14.5px;color:#6B4A18}
.tip b{color:var(--gold)}
.mark{margin-top:16px;background:none;border:1.5px solid var(--line);border-radius:8px;padding:7px 15px;
 cursor:pointer;font:inherit;font-size:13.5px;color:var(--muted);transition:.18s}
.mark:hover{border-color:var(--teal);color:var(--teal)}
.mark.on{background:var(--teal);border-color:var(--teal);color:#fff}
/* ---- quiz ---- */
.quiz{background:var(--navy);color:#EAF1F4;border-radius:14px;padding:30px 30px 26px;margin-top:38px}
.quiz h2{color:#fff;margin-bottom:4px}
.quiz .sub{color:#9FBAC6;font-size:14px;margin-bottom:22px}
.q{border-top:1px solid #18566F;padding-top:20px;margin-top:20px}
.q:first-of-type{border-top:0;padding-top:0;margin-top:0}
.q p.qt{font-weight:600;margin-bottom:12px;font-size:16px}
.opt{display:block;width:100%;text-align:right;background:#0F4A63;border:1.5px solid #1B6382;color:#DCE9EE;
 padding:10px 15px;border-radius:9px;margin-bottom:8px;cursor:pointer;font:inherit;font-size:14.5px;transition:.15s}
.opt:hover:not(:disabled){background:#15597a}
.opt:disabled{cursor:default}
.opt.right{background:#135C45;border-color:#1F7A52;color:#C9F2DF}
.opt.wrong{background:#5E2222;border-color:#8A3333;color:#F3D3D3}
.exp{font-size:14px;color:#AFC9D4;background:#0F4A63;border-radius:8px;padding:11px 14px;margin-top:6px}
.score{margin-top:24px;padding-top:18px;border-top:1px solid #18566F;font-size:15px;color:#9FBAC6}
.score b{color:#5FD0A8;font-size:17px}
/* ---- misc ---- */
.next{margin-top:34px;display:flex;gap:12px;flex-wrap:wrap}
.btn{background:var(--teal);color:#fff;border:0;padding:12px 24px;border-radius:9px;cursor:pointer;font:inherit;font-size:15px;font-weight:600}
.btn:hover{background:#0b6b6a}
.btn.g{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.g:hover{background:#efece5}
.reflist a{display:flex;justify-content:space-between;gap:14px;align-items:center;background:var(--card);
 border:1px solid var(--line);border-radius:10px;padding:15px 18px;margin-bottom:10px;text-decoration:none;color:var(--ink);transition:.16s}
.reflist a:hover{border-color:var(--teal);transform:translateX(-3px)}
.reflist span{color:var(--muted);font-size:12px;direction:ltr;font-family:monospace;word-break:break-all;text-align:left;max-width:48%}
.done-card{background:linear-gradient(135deg,#0B3C53,#0E7C7B);color:#fff;border-radius:14px;padding:34px;text-align:center}
.done-card h2{color:#fff;font-size:25px}
.done-card p{color:#CFE7E6;margin-top:8px}
.foot{margin-top:50px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}

.ws-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px 26px;margin-bottom:18px}
.ws-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:22px}
.ws-tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;cursor:pointer;text-align:right;font:inherit;transition:.16s}
.ws-tile:hover{border-color:var(--teal);transform:translateY(-2px)}
.ws-tile b{display:block;color:var(--navy);font-size:17px;margin-bottom:6px}
.ws-tile .ic{color:var(--teal);font-size:19px;font-family:monospace}
.ws-tile small{color:var(--muted);font-size:13px;display:block;margin-top:6px;line-height:1.6}
.pbox{border-radius:10px;padding:16px 18px;margin:10px 0 4px;white-space:pre-wrap;font-size:14.5px;line-height:1.9}
.pbad{background:#FBEDED;border:1px solid #EFD3D3;color:#6E2B2B}
.pgood{background:#EDF6F1;border:1px solid #CFE6DB;color:#1D4536}
.plabel{font-size:12.5px;font-weight:700;letter-spacing:1px;margin-top:18px}
.plabel.b{color:var(--no)} .plabel.g{color:var(--ok)}
.stepline{display:flex;gap:14px;padding:14px 0;border-top:1px dashed var(--line)}
.stepline:first-of-type{border-top:0}
.stepn{background:var(--teal);color:#fff;width:25px;height:25px;border-radius:7px;display:grid;place-items:center;font-size:12.5px;flex:none;margin-top:3px}
.stepline b{display:block;color:var(--navy);margin-bottom:2px}
.stepline span{color:#44555E;font-size:14.5px}
.anat{background:var(--teal-l);border-radius:10px;padding:16px 20px;margin:16px 0}
.anat li{margin:5px 20px 5px 0;color:#14484C;font-size:15px}
.err{background:#FBEDED;border-radius:10px;padding:16px 20px;margin-top:18px}
.err li{margin:5px 20px 5px 0;color:#6E2B2B;font-size:14.5px}
.err b{color:var(--no);display:block;margin-bottom:6px;font-size:14px;letter-spacing:.5px}
.prac{background:#FDF6E9;border:1px solid #F0DFBF;border-radius:12px;padding:24px 26px;margin-top:32px}
.prac h2{color:#7A5415}
.prac .tk{background:#fff;border-radius:9px;padding:14px 16px;margin:12px 0;color:#4A3A1C;font-size:15px}
.prac li{margin:4px 20px 4px 0;color:#6B4A18;font-size:14.5px}
.ws-card .exp{background:#F1F5F6;color:#3C4F57}
.prac .lr{margin-top:12px;color:#7A5415;font-size:14.5px}
@media(max-width:860px){
 .wrap{grid-template-columns:1fr}
 aside{position:static;height:auto}
 nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
 nav button{width:auto;white-space:nowrap;border-right:0;border-bottom:3px solid transparent}
 nav button.on{border-right:0;border-bottom-color:var(--teal)}
 .navsep{display:none}
 main{padding:28px 20px 70px}
 h1{font-size:26px}
}
</style>
</head>
<body>
<div class="wrap">
 <aside>
  <div class="brand">منصة تعلّم كلاود<span>CLAUDE LEARNING PATH</span></div>
  <div class="prog"><div class="bar"><i id="bar"></i></div><small id="ptxt">٠٪ مكتمل</small></div>
  <nav id="nav"></nav>
  <div class="navsep"></div>
  <nav id="wnav"></nav>
  <div class="navsep"></div>
  <nav id="rnav"></nav>
  <div class="navsep"></div>
  <nav><button id="refsBtn"><span class="d">REFERENCES</span>المصادر الرسمية</button></nav>
 </aside>
 <main id="main"></main>
</div>
<script>// محتوى المنصة
const STAGES = [
{
 id:"s1", title:"المرحلة الأولى", name:"الأساسيات", icon:"◆",
 goal:"بعد هذي المرحلة بتعرفين وش هو كلاود، كيف توصلينه، وكيف تتحكمين فيه.",
 lessons:[
  { t:"وش هو كلاود؟", body:[
    "كلاود نموذج لغوي كبير (Large Language Model) من شركة أنثروبيك، مدرَّب يكون مساعداً نافعاً وصادقاً وغير ضار، وبأسلوب محادثة طبيعي.",
    "معناها إنه ما هو محرك بحث. هو يفهم طلبك ويولّد لك جواباً جديداً — مو يجيب لك روابط."
   ], tip:"فكّري فيه كزميل ذكي جداً، لكنه ما يعرف شي عن سياقك إلا اللي تقولينه له."},
  { t:"من وين تستخدمينه؟", body:[
    "من المتصفح على claude.ai، أو من تطبيق سطح المكتب لويندوز وماك، أو من تطبيق الجوال للآيفون والأندرويد.",
    "نفس الحساب ونفس المحادثات في كل الأماكن — تبدئين على اللابتوب وتكملين من الجوال.",
    "الشروط: تكونين في دولة مدعومة، والعمر ١٨ سنة فأكثر."
   ]},
  { t:"الـ Prompt — الطلب", body:[
    "الـ prompt هو الرسالة اللي ترسلينها. النصيحة الرسمية من أنثروبيك: كلّمي كلاود بطبيعية، مثل ما تكلمين زميلة أو صديقة.",
    "الطلبات تتراوح من سؤال بسيط («كيف أعلّق إطار صورة؟») إلى مشروع كامل متعدد الخطوات (تحليل، كتابة، برمجة).",
    "زر «+» تحت على اليسار، أو اكتبي «/» — يطلعون لك خيارات وأوامر إضافية."
   ]},
  { t:"الموديل ومستوى الجهد", body:[
    "اسم الموديل يظهر تحت مربع الكتابة في الويب وسطح المكتب، وفوق الشاشة في الجوال. اضغطي عليه وغيّريه.",
    "كمان تقدرين تتحكمين بمقدار «الجهد» (Effort) اللي يبذله في الرد، وهل يستخدم التفكير الممتد.",
    "جهد عالي = رد أعمق وأبطأ (تصميم، تحليل، برمجة). جهد منخفض = رد أسرع (ترجمة جملة، رسالة قصيرة)."
   ]},
  { t:"اللغات والحدود", body:[
    "كلاود أقوى في الإنجليزي، ويشتغل زين في اللغات الشائعة ومنها العربي، وعنده معرفة واسعة بلغات البرمجة.",
    "في الخطة المجانية فيه حد استخدام للجلسة يتجدد كل خمس ساعات، وعدد الرسائل يختلف حسب الضغط.",
    "كلاود ينبّهك لما توصلين الحد، أو لما يكون طلبك أطول من نافذة السياق."
   ], tip:"إذا وصلتِ الحد وأنت في نص شغل مهم: اطلبي منه يلخّص لك وش وصلتوا له قبل ما تنتهي الجلسة."}
 ],
 quiz:[
  { q:"وش أفضل طريقة تكلمين فيها كلاود؟", a:["بكلمات مفتاحية مثل محرك البحث","بطبيعية مثل ما تكلمين زميلة","بأوامر برمجية فقط"], c:1,
    e:"التوجيه الرسمي: كلّميه بطبيعية مثل ما تكلمين زميلة أو صديقة. هو يفهم اللغة الطبيعية، مو الكلمات المفتاحية." },
  { q:"متى تستخدمين مستوى جهد عالي؟", a:["في ترجمة جملة قصيرة","في تصميم قاعدة بيانات أو تحليل معقّد","دائماً في كل طلب"], c:1,
    e:"الجهد العالي يعطي رد أعمق لكنه أبطأ، فهو للمهام المعقّدة. للطلبات البسيطة الجهد المنخفض أسرع ويكفي." },
  { q:"حد الاستخدام في الخطة المجانية يتجدد كل:", a:["ساعة","خمس ساعات","أربع وعشرين ساعة"], c:1,
    e:"الخطة المجانية فيها حد مبني على الجلسة يتجدد كل خمس ساعات." }
 ]
},
{
 id:"s2", title:"المرحلة الثانية", name:"كتابة الأوامر", icon:"◆◆",
 goal:"هذي أهم مرحلة. الفرق بين رد ممتاز ورد عادي غالباً في طريقة كتابة الطلب، مو في الموديل.",
 lessons:[
  { t:"الست تقنيات الأساسية", body:[
    "١) الوضوح (Clarity): تعليمات صريحة ما تحتمل أكثر من معنى.",
    "٢) الأمثلة (Examples): تعطينه نموذج للمدخل والمخرج اللي تبينه.",
    "٣) التنظيم بوسوم XML: تفصلين التعليمات عن السياق عن المدخلات.",
    "٤) تحديد الدور (Role prompting): تعطينه تخصصاً، مثل «أنت معلم لغة إنجليزية للابتدائي».",
    "٥) التفكير (Thinking): تطلبين منه يفكر خطوة بخطوة قبل الإجابة.",
    "٦) تسلسل الأوامر (Prompt chaining): تقسّمين المهمة خطوات، مخرج كل وحدة يدخل في اللي بعدها."
   ]},
  { t:"اختبار الزميلة", body:[
    "القاعدة الذهبية في الدليل الرسمي: تعاملي مع كلاود كموظف جديد كفء، لكنه ما يملك سياقك.",
    "الاختبار العملي: لو وريتِ طلبك لزميلة ما عندها خلفية عن الموضوع — هل تنحار؟ إذا نعم، كلاود بينحار مثلها.",
    "فحدّدي: وش المطلوب بالضبط، لمن، بأي صيغة، وبأي قيود."
   ], tip:"إذا تبين أكثر من الحد الأدنى، اطلبيه صراحة. «سوّ لي لوحة تحليلات» تعطي أقل بكثير من «سوّ لي لوحة تحليلات وضمّن أكبر عدد ممكن من المميزات وتجاوز الأساسيات»."},
  { t:"اشرحي «ليش» مو بس «وش»", body:[
    "قاعدة بدون سبب أضعف من قاعدة مع سبب، لأن السبب يخلي كلاود يعمّم صح على حالات ما ذكرتيها.",
    "ضعيف: «لا تستخدم النقاط الثلاث أبداً».",
    "قوي: «ردك بينقرأ بصوت آلي، فلا تستخدم النقاط الثلاث لأن المحرك ما يعرف كيف ينطقها»."
   ]},
  { t:"الأمثلة أقوى أداة", body:[
    "الأمثلة أكثر طريقة موثوقة لضبط الشكل والنبرة والبنية.",
    "الدليل ينصح بـ ٣ إلى ٥ أمثلة، وتكون: واقعية من حالتك، متنوعة تغطي الحالات الطرفية، ومحطوطة داخل وسوم.",
    "وتقدرين تطلبين من كلاود نفسه يقيّم أمثلتك أو يولّد لك أمثلة إضافية."
   ]},
  { t:"قواعد الصيغة والمستندات الطويلة", body:[
    "قولي وش تبين مو وش ما تبين: بدل «لا تستخدم ماركداون» اكتبي «اكتب ردك فقرات نثرية متسلسلة».",
    "في المستندات الطويلة: حطّي المستند في الأعلى والسؤال في النهاية. الدليل يذكر إن هذا يرفع الجودة بنسبة توصل ٣٠٪ في المدخلات المعقّدة متعددة المستندات.",
    "اطلبي منه يستخرج الاقتباسات المهمة أول قبل ما يجاوب — يساعده يتجاهل النص غير المهم.",
    "للتحقق: «قبل ما تخلص، تأكد من إجابتك مقابل هذه المعايير...»"
   ]},
  { t:"مثال مطبّق", body:[
    "ضعيف: «سوّ لي أسئلة إنجليزي للصف الرابع».",
    "قوي: «أنت معلّم لغة إنجليزية خبير في المرحلة الابتدائية. سوّ ١٠ أسئلة اختيار من متعدد على درس الأفعال الماضية المنتظمة لطلاب الصف الرابع في عُمان. القيود: كل سؤال ٤ خيارات؛ المفردات لا تتجاوز مستوى A1؛ ضع الإجابة الصحيحة وشرحها بالعربي تحت كل سؤال. السبب: الأسئلة بتنطبع في ورقة عمل والأمهات بيصححونها في البيت.»",
    "لاحظي: فيه دور + مهمة محددة + جمهور + قيود + سبب."
   ]}
 ],
 quiz:[
  { q:"وين تحطين المستند الطويل في طلبك؟", a:["في الأعلى والسؤال في النهاية","في النهاية بعد السؤال","ما يفرق"], c:0,
    e:"المستند في الأعلى والسؤال في النهاية. الدليل الرسمي يذكر إن هذا يرفع الجودة بنسبة توصل ٣٠٪ في المدخلات المعقّدة." },
  { q:"أي صياغة أقوى؟", a:["«لا تستخدم تنسيق ماركداون»","«اكتب ردك فقرات نثرية متسلسلة»","الاثنتان نفس الشي"], c:1,
    e:"القاعدة: قولي وش تبين، مو وش ما تبين. الصياغة الإيجابية تعطي نتيجة أدق." },
  { q:"كم مثال ينصح به الدليل الرسمي؟", a:["مثال واحد يكفي","٣ إلى ٥ أمثلة","أكبر عدد ممكن"], c:1,
    e:"٣ إلى ٥ أمثلة، بشرط تكون واقعية ومتنوعة تغطي الحالات الطرفية." },
  { q:"ليش نشرح السبب وراء القاعدة؟", a:["عشان الرد يطول","عشان كلاود يعمّم صح على حالات ما ذكرناها","ما له فائدة"], c:1,
    e:"السبب يساعد كلاود يفهم المبدأ، فيطبّقه صح حتى في الحالات اللي ما ذكرتيها." }
 ]
},
{
 id:"s3", title:"المرحلة الثالثة", name:"الأدوات والمخرجات", icon:"◆◆◆",
 goal:"تتعلمين تستخدمين أدوات كلاود بدل ما تكتفين بالمحادثة النصية.",
 lessons:[

 strong:"أنت مصمّم قواعد بيانات خبير في PostgreSQL 16.\n\nالنظام: منصة تعليمية لتدريس الإنجليزي لطلاب المدارس.\n\nالكيانات والعلاقات:\n- الطالب ينتمي لصف واحد، والصف فيه عدة طلاب.\n- المنهج مقسّم وحدات، والوحدة فيها عدة دروس.\n- كل درس له عدة أسئلة اختيار من متعدد.\n- كل محاولة للطالب على سؤال تُسجَّل بالوقت والإجابة وهل هي صحيحة.\n\nالاستخدام المتوقع: ٣٠٠٠ طالب، وأكثر استعلام تكراراً هو «أعطني تقدّم طالب معيّن في وحدة معيّنة».\n\nالمطلوب:\n1. المخطط (schema) بصيغة CREATE TABLE كاملة مع المفاتيح والقيود.\n2. شرح بالعربي لكل جدول في سطر واحد.\n3. الفهارس (indexes) اللازمة للاستعلام المتكرر أعلاه مع سبب كل فهرس.\n4. استعلام جاهز يحسب نسبة إجابات الطالب الصحيحة في وحدة معيّنة.\n\nالقيود: لا تستخدم أي امتداد خارجي، وسمّ الجداول بصيغة الجمع بالإنجليزي.",

 lead:"الربط معناه إنك تعطين كلاود وصولاً لتطبيقاتك — بريدك، ملفاتك، تقويمك، أو أي خدمة — فيقرأ ويكتب فيها مباشرة بدل ما تنسخين وتلصقين. التقنية اللي تحت هذا كله اسمها MCP، وهي معيار مفتوح لربط أدوات الذكاء الاصطناعي بمصادر البيانات.",
 blocks:[
  { h:"ثلاث طرق للربط — اختاري حسب حالتك", items:[
    "من دليل الموصّلات الجاهز: تطبيقات مشهورة جاهزة بضغطة (مثل Gmail وGoogle Drive وGitHub). ما تحتاجين أي رابط ولا إعدادات.",
    "موصّل مخصّص برابط: أي خدمة عندها خادم MCP بعيد، تاخذين رابطه وتضيفينه بنفسك.",
    "خادم محلي على جهازك: يُضبط من تطبيق سطح المكتب عبر ملف الإعدادات، ويشتغل على جهازك فقط."
   ]},
  { h:"الطريقة الأولى — من الدليل الجاهز", steps:[
    "افتحي الإعدادات ثم Connectors.",
    "تصفّحي دليل الموصّلات واختاري التطبيق اللي تبينه.",
    "اضغطي ربط، وبيحوّلك للتطبيق نفسه عشان تسجّلين دخول وتوافقين على الصلاحيات.",
    "ترجعين لكلاود وتلقين الموصّل مكتوب عنده «متصل»."
   ], note:"بعد الربط ما تحتاجين تستدعينه يدوياً — كلاود يعرف بنفسه متى يحتاج يستخدمه." },
  { h:"الطريقة الثانية — موصّل مخصّص برابط (الخطوات الرسمية بالترتيب)", steps:[
    "قبل ما تبدئين: تأكدي إن الخادم متاح للعموم على HTTPS ومنفذ 443 القياسي. كلاود يتصل من سحابة أنثروبيك مو من جهازك، والروابط ذات المنفذ المخصّص ما تشتغل.",
    "اعرفي نوع المصادقة اللي يطلبها الخادم: OAuth؟ أو بيانات ثابتة مثل مفتاح API؟ أو بدون تسجيل دخول؟ هذا مكتوب في توثيق الخدمة.",
    "افتحي Customize ثم Connectors.",
    "اضغطي + Add ثم Add custom connector.",
    "اكتبي اسماً للموصّل — هذا اللي يظهر في قائمة الموصّلات.",
    "الصقي رابط خادم MCP البعيد كما توثّقه الجهة بالضبط مع المسار كامل، مثل https://example.com/mcp — ثم Continue.",
    "راجعي إعدادات المصادقة اللي اكتشفها كلاود وعدّليها إذا احتاج الخادم شيئاً مختلفاً — ثم Continue.",
    "تحت Authentication اختاري: Sign in now أو Sign in when needed أو No sign in.",
    "تحت OAuth client اختاري الخيار المناسب (الشرح في القسم اللي تحت).",
    "تحت Request headers: إذا كان الخادم يستخدم مفتاح API أو رمز Bearer بدل OAuth، حطيه هنا.",
    "اضغطي Add عشان تخلصين."
   ], note:"ملاحظة مهمة: في الواجهة الحالية الخيار اسمه OAuth client، مو Advanced settings. إذا شفتِ اسماً مختلفاً فالمقصود هو نفس القسم." },
  { h:"خطوة OAuth بالتفصيل — من وين تجيبين Client ID و Secret", items:[
    "أول شي: أغلب الخدمات ما تحتاج هذي الخطوة أصلاً. الخيار الموصى به هو Use Claude's published identity، وفيه ما تدخلين أي شي.",
    "الخيار الثاني Register automatically: كلاود يسجّل نفسه عند الخدمة تلقائياً. برضو ما تدخلين شي.",
    "الخيار الثالث Use your own OAuth client: اختاريه فقط إذا كان توثيق الخدمة يطلبه صراحة. هنا بس تدخلين Client ID و Client Secret.",
    "من وين تجيبينهما؟ من لوحة تحكم المطوّرين في الخدمة نفسها — مو من كلاود. تسجّلين دخولك عندهم، تدوّرين قسم اسمه Developer settings أو OAuth apps أو API، وتسوّين تطبيق OAuth جديد. بعد ما تسوّينه يعطيك القيمتين.",
    "الـ Client Secret يُعرض مرة واحدة غالباً — انسخيه واحفظيه فوراً.",
    "قبل ما تضيفين الموصّل في كلاود: سجّلي هذا الرابط كـ redirect URL في إعدادات تطبيق OAuth عندهم — https://claude.ai/api/mcp/auth_callback",
    "إذا كان الخادم أعطاك Client ID فقط بدون Secret، حطّي الـ ID واتركي خانة الـ Secret فاضية.",
    "قسم OAuth client ما يظهر لك أصلاً إذا اخترتِ No sign in."
   ], tip:"الترتيب الصحيح: سجّلي تطبيق OAuth عند الخدمة أولاً وسجّلي فيه رابط إعادة التوجيه، وبعدها تعالي لكلاود وأضيفي الموصّل. بالعكس بيفشل تسجيل الدخول." },
  { h:"بعد الإضافة — خطوات ما تنساينها", items:[
    "فعّلي الموصّل في المحادثة: اضغطي + تحت على اليسار، ثم Connectors، وشغّلي الموصّل.",
    "أكملي تسجيل الدخول وراجعي الصلاحيات اللي يطلبها الخادم قبل الموافقة.",
    "اضغطي «السماح دائماً» فقط للأدوات اللي تثقين فيها تشتغل بدون إشراف.",
    "من قائمة الأدوات، عطّلي الأدوات اللي ما تحتاجينها — أقل أدوات يعني أمان أعلى ووضوح أكثر.",
    "في وضع البحث المعمّق: عطّلي أي أداة تقدر تكتب في تطبيقات خارجية.",
    "لتعديل موصّل موجود: احذفيه وأعيدي إضافته بالبيانات الجديدة — ما فيه تعديل مباشر."
   ]},
  { h:"في خطط الفرق والمؤسسات", items:[
    "المالك فقط هو اللي يضيف: من Organization settings ثم Connectors، ثم Add، ويمرّر على Custom ويختار Web، ويكمل نفس الخطوات.",
    "بعدها كل عضو يروح Customize ثم Connectors، يلقى الموصّل (غالباً عليه علامة Custom)، ويضغط Connect عشان يربط حسابه هو."
   ]},
  { h:"من وين أحصل على الرابط؟ — الجواب المهم", items:[
    "الرابط ما تخترعينه ولا تبحثين عنه عشوائياً. مصدره الجهة صاحبة الخدمة.",
    "ادخلي موقع الخدمة اللي تبين ربطها، ودوّري في التوثيق عن كلمة MCP أو Integrations أو Connect to Claude. الرابط يكون مكتوباً هناك بالنص.",
    "صيغته دائماً تنتهي بمسار، غالباً mcp — مثل https://example.com/mcp",
    "إذا طلبت الخدمة OAuth خاصاً بك، بتجيبين Client ID وClient Secret من لوحة تحكم المطوّرين عندهم.",
    "وإذا طلبت منك رابط إعادة توجيه (redirect URL) تسجّلينه عندهم، كلاود يستخدم: https://claude.ai/api/mcp/auth_callback",
    "وإذا كانت الخدمة ما عندها خادم MCP أصلاً — ما ينفع الربط المباشر. البديل: المتصفح، أو بناء خادم بنفسك عبر الـ API."
   ]},
  { h:"خادمك أنتِ — إذا بغيتِ تربطين منصتك", items:[
    "أنتِ مطوّرة ويب، فتقدرين تبنين خادم MCP لمنصتك التعليمية وتربطينه بكلاود.",
    "النتيجة: تكتبين «كم طالب ما أكمل الوحدة الثالثة؟» ويجاوبك من قاعدة بيانات منصتك مباشرة.",
    "كلاود يدعم نوعين من النقل: SSE وStreamable HTTP — والموصى به للمشاريع الجديدة هو Streamable HTTP.",
    "ويدعم خوادم بدون مصادقة وخوادم بـ OAuth."
   ]},
  { h:"أمور تهمك قبل ما تربطين", items:[
    "الموصّلات المخصّصة متاحة في كل الخطط: المجانية وPro وMax وTeam وEnterprise. والمجانية محدودة بموصّل واحد.",
    "لما تضيفين موصّلاً مخصّصاً، كلاود يتصل بالخادم من بنية أنثروبيك السحابية، مو من جهازك.",
    "الخوادم المحلية اللي تُضبط من ملف إعدادات تطبيق سطح المكتب آلية منفصلة، وتستخدم شبكتك المحلية.",
    "تقدرين تسحبين الصلاحيات في أي وقت: إمّا بفصل الموصّل من إعدادات كلاود، أو من إعدادات الأمان في الخدمة نفسها.",
    "اربطي فقط الخدمات اللي تثقين فيها. الموصّل يعطي وصولاً فعلياً لبياناتك."
   ]}
 ]
},
{
 id:"r2", name:"المهارات — ماذا تفعل كل واحدة", icon:"◈",
 lead:"المهارات المتاحة لك مجمّعة في حزم حسب المجال. هنا وش تسوي كل مجموعة، وأي مهارة تحديداً ترفع مستوى شغلك في البرمجة والتصميم والمونتاج والبحوث. ما تحتاجين تحفظين الأسماء — يكفي تعرفين إنها موجودة، وتطلبين المهمة وكلاود يختار.",
 blocks:[
  { h:"لرفع مستوى البرمجة إلى الاحتراف", items:[
    "brainstorming — تبدأ معك بالعصف الذهني قبل أي كود، فتخرجين بفكرة مدروسة مو أول فكرة.",
    "writing-plans — تحوّل الفكرة لخطة تنفيذ مكتوبة بخطوات، وهذي اللي تمنع المشاريع من التوهان.",
    "test-driven-development — تكتب الاختبار قبل الكود. النتيجة: كود تثقين فيه مو كود «يبدو شغّال».",
    "systematic-debugging — تتبّع منهجي للخطأ من العرَض إلى السبب الجذري، بدل التخمين.",
    "requesting-code-review و receiving-code-review — مراجعة كود منظّمة وكيف تتعاملين مع الملاحظات.",
    "verification-before-completion — تتحقق إن المهمة فعلاً اكتملت قبل ما تُعلن منتهية.",
    "deep-refactor و test-refactor — إعادة هيكلة كود قديم بأمان بدون ما ينكسر.",
    "frontend-design — واجهات بتصميم محترم مو الشكل العام المكرر.",
    "web-artifacts-builder — بناء تطبيقات ويب تفاعلية بصفحة واحدة (مثل هذي المنصة بالضبط).",
    "using-git-worktrees و dispatching-parallel-agents — شغل متوازٍ على أكثر من فرع أو مهمة."
   ], tip:"الترتيب العملي لأي ميزة جديدة في منصتك: brainstorming ← writing-plans ← test-driven-development ← verification-before-completion." },
  { h:"للتصميم", items:[
    "design-system — تبني نظام تصميم كامل: ألوان، خطوط، مسافات، مكوّنات. بعدها كل تصميم يطلع متسقاً تلقائياً.",
    "design-critique — نقد تصميمي لعملك: وش ضعيف ووش يحتاج تعديل ولماذا.",
    "accessibility-review — فحص إمكانية الوصول: تباين الألوان، أحجام النصوص، دعم قارئ الشاشة.",
    "ux-copy — صياغة نصوص الواجهة: الأزرار، الرسائل، التنبيهات.",
    "design-and-templates — بناء قوالب قابلة لإعادة الاستخدام بدل تصميم كل شي من الصفر.",
    "canva — سير عمل كامل داخل كانفا: Brand Kit، إنتاج بالجملة، تغيير المقاس لكل منصة.",
    "image-prompt — كتابة أوامر الصور بشكل احترافي، وتوجيهك لأنسب أداة.",
    "ideogram — للصور اللي فيها نصوص وتخطيط: بطاقات اقتباس، أغلفة، بوسترات، لافتات.",
    "flux و nano-banana — توليد وتعديل صور واقعية، وثبات الشخصية أو المنتج عبر حملة كاملة.",
    "thumbnail-design — تصميم صور مصغّرة للفيديوهات.",
    "ai-image-editing — إزالة عنصر من صورة، حذف الخلفية، تكبير الدقة، ترميم صورة قديمة."
   ]},
  { h:"للمونتاج والفيديو", items:[
    "short-form-video-script و scripting-and-storyboarding — السيناريو ولوحة اللقطات قبل التصوير.",
    "capcut — تحرير فيديو قصير: إيقاع القصّ، الترجمة التلقائية، مزامنة الصوت، التصدير.",
    "descript — تحرير البودكاست والمقابلات عن طريق تحرير النص المكتوب بدل الخط الزمني. حذف كلمات الحشو والصمت.",
    "opus-clip و captions-and-clipping — تحويل فيديو طويل إلى مقاطع قصيرة تلقائياً مع ترجمة.",
    "ai-video — الموجّه العام: يحدد لك أي أداة تناسب فيديوك ويكتب الوصف المطلوب.",
    "veo-3 و kling و luma و runway — توليد مشاهد فيديو بالذكاء الاصطناعي، كل واحدة بقوة مختلفة.",
    "heygen و synthesia — أفاتار يتكلم أمام الكاميرا، مع دبلجة للغات أخرى.",
    "ai-voiceover — تعليق صوتي احترافي: اختيار الصوت وتوجيه الأداء.",
    "ai-music-and-sound — موسيقى خلفية ومؤثرات صوتية مرخّصة، بدون مشاكل حقوق.",
    "talking-head-and-piece-to-camera — إذا بتظهرين أنتِ أمام الكاميرا."
   ], tip:"لفيديو تعريفي بمنصتك: short-form-video-script للسيناريو ← capcut للمونتاج ← ai-voiceover للتعليق ← ai-music-and-sound للموسيقى." },
  { h:"لكتابة البحوث والمحتوى الموثّق", items:[
    "deep-research — بحث معمّق متعدد المصادر مع تقرير منظّم.",
    "content-research-and-sourcing — التحقق من المعلومات: تتبّع كل إحصائية لمصدرها الأصلي، وكشف الاقتباسات المخترعة.",
    "data-and-original-research — تحويل بياناتك أنتِ إلى دراسة أو استبيان أو تحليل قابل للنشر والاقتباس.",
    "research-synthesis — تجميع نتائج بحث متفرقة في خلاصة مترابطة.",
    "competitor-analysis و audience-research — تحليل المنافسين وفهم الجمهور.",
    "dataviz — تحويل البيانات لرسوم بيانية صحيحة وغير مضللة.",
    "write-project-docs و write-adr و review-docs — توثيق المشاريع وقرارات التصميم ومراجعة التوثيق.",
    "write-sop — كتابة إجراءات تشغيل معيارية خطوة بخطوة.",
    "scrape و search و live-research — جمع بيانات حيّة من الويب."
   ], tip:"قاعدة ذهبية في البحوث: أي إحصائية يعطيها لك أي ذكاء اصطناعي تُعتبر غير مؤكدة لين تشوفين المصدر الأصلي بنفسك." },
  { h:"للملفات والمخرجات", items:[
    "docx و pptx و xlsx و pdf — بناء ملفات Word وPowerPoint وExcel وPDF بجودة احترافية.",
    "file-reading و pdf-reading — قراءة واستخراج محتوى من ملفاتك بدقة."
   ]},
  { h:"للإدارة وبناء مهاراتك", items:[
    "skill-creator — يساعدك تبنين مهارة جديدة ويراجعها ويقترح حالات اختبار.",
    "task-management و memory-management — إدارة مهامك وذاكرة العمل.",
    "computer-use و chrome-browser — تشغيل برامج جهازك والتعامل مع المواقع."
   ]},
  { h:"مهاراتك الخاصة — الموجودة في حسابك", items:[
    "بناء منصة تعليمية حسب الصف — من كتاب المنهج، بالعربي والإنجليزي، مع ألعاب واختبارات وتحضير للاختبار النهائي.",
    "إعلانات وعروض المنصات — نصوص ترويجية وأسعار بالعربي بألوان هويتك الكحلي والتركوازي.",
    "طلبات التوظيف — تجهيز السيرة ورسالة التغطية لوظائف الويب في عُمان."
   ], tip:"هذي الثلاث مبنية على شغلك أنتِ. أي تعديل تبينه عليها قولي لي وأعدّلها." }
 ]
},
{
 id:"r3", name:"الإضافات (Plugins)", icon:"⊞",
 lead:"الإضافة حزمة جاهزة تضيف لكلاود عدة أشياء مرة وحدة. بدل ما ترفعين عشر مهارات وحدة وحدة، تضيفين إضافة وحدة تجيب كل اللي فيها.",
 blocks:[
  { h:"وش ممكن تحتوي الإضافة؟", items:[
    "مهارات (Skills) — إجراءات وخبرة في مجال معيّن.",
    "أوامر مختصرة (Commands) — تكتبينها بشرطة مائلة لتشغيل سير عمل جاهز.",
    "موصّلات (MCP connectors) — ربط بخدمات، مدمج داخل الإضافة.",
    "وكلاء (Agents) — مساعدون متخصصون لمهام فرعية."
   ], note:"كل تطبيق يحمّل المكوّنات اللي يدعمها ويتجاهل الباقي — فنفس الإضافة ممكن تعطي مميزات أكثر في مكان عن مكان." },
  { h:"كيف تضيفينها؟", steps:[
    "افتحي Customize ثم Plugins في claude.ai أو تطبيق سطح المكتب — هذي نفس الصفحة اللي فيها الموصّلات والمهارات.",
    "تصفّحي الإضافات المتاحة واختاري اللي يناسبك.",
    "فعّليها، وبتلقين مهاراتها وأوامرها متاحة في محادثاتك مباشرة."
   ], note:"الإضافات اللي تثبّتينها من سطر أوامر كلاود كود تبقى على ذاك الجهاز فقط وما تنضاف لحسابك في claude.ai." },
  { h:"وش عندك الآن؟", items:[
    "حزمة مهارات التواصل الاجتماعي — أكبر حزمة عندك: محتوى، تصميم، فيديو، مونتاج، نمو المنصات، وتحليلات. هذي اللي تغطي لك التصميم والمونتاج والتسويق لمنصاتك.",
    "حزمة البرمجة المتقدمة (superpowers) — منهجية احترافية في التخطيط والاختبارات والتصحيح والمراجعة.",
    "حزمة إعادة الهيكلة (deep-refactor) — تنظيف وتحسين الكود القديم.",
    "حزمة التصميم (design) — نظام تصميم، نقد، إمكانية وصول، نصوص واجهة، وبحث مستخدمين.",
    "حزم التوثيق (opendocs وgitbook وdoc-authoring) — كتابة توثيق المشاريع والإجراءات.",
    "حزمة جمع البيانات (brightdata) — بحث وجمع بيانات من الويب.",
    "حزمة الإنتاجية (productivity) — مهام وذاكرة عمل."
   ]},
  { h:"متى تضيفين إضافة ومتى تكتفين بمهارة؟", items:[
    "إضافة: لما تبين قدرات مجال كامل جاهزة بسرعة — مثل التصميم أو الفيديو.",
    "مهارة خاصة: لما تبين طريقتك أنتِ بالذات — القالب والألوان ومعايير القبول اللي تخصك.",
    "والعملي: ابدئي بإضافة جاهزة لتغطية المجال، وبعدها سوّي مهارة صغيرة تضبط التفاصيل على ذوقك."
   ], tip:"لا تفعّلين كل شي مرة وحدة. كل مهارة مفعّلة تاخذ جزءاً من السياق، فاختاري بعناية وطفّي اللي ما تستخدمينه." }
 ]
},
{
 id:"r4", name:"الموديلات — متى تستخدمين كل واحد", icon:"◉",
 lead:"الموديل هو العقل اللي يرد عليك. الأقوى ليس دائماً الأفضل: الفرق في العمق مقابل السرعة. والقاعدة البسيطة: اختاري حسب صعوبة المهمة، مو حسب أهميتها عندك.",
 blocks:[
  { h:"الموديلات المتاحة", items:[
    "Opus — الأقوى، للمهام المعقدة: تصميم أنظمة، تحليل عميق، برمجة متقدمة، قرارات معمارية. أبطأ ويستهلك من حدّ استخدامك أكثر.",
    "Sonnet — التوازن بين السرعة والذكاء. هذا اللي يستخدمه أغلب الناس يومياً: كتابة، تحضير دروس، شرح، مهام عادية.",
    "Haiku — الأسرع والأخف، للمهام البسيطة المتكررة: ترجمة جملة، تصنيف، إعادة صياغة قصيرة.",
    "طبقة Mythos (ومنها Fable) — الطبقة الأعلى، وهي ليست متاحة للعموم حالياً."
   ], note:"الأسماء والأرقام تتغيّر مع الإصدارات. المهم تفهمين المنطق: Opus للعمق، Sonnet للتوازن، Haiku للسرعة." },
  { h:"متى تستخدمين Opus؟", items:[
    "تصميم قاعدة بيانات منصتك أو مراجعة معماريتها.",
    "تتبّع خطأ برمجي معقّد ما عرفتِ سببه.",
    "تخطيط منهج فصل كامل أو مشروع متعدد المراحل.",
    "مراجعة نقدية لشغل مهم قبل ما يطلع للناس."
   ]},
  { h:"متى يكفي Sonnet؟", items:[
    "تحضير أوراق العمل والشروحات والاختبارات.",
    "كتابة رسائل أولياء الأمور والمحتوى الترويجي.",
    "تعديلات برمجية واضحة ومحدودة.",
    "أغلب شغلك اليومي فعلياً."
   ]},
  { h:"متى Haiku؟", items:[
    "ترجمة سريعة أو إعادة صياغة جملة.",
    "تصنيف قائمة أو تنسيق نص.",
    "أي مهمة تكرّرينها عشرات المرات وتبين فيها السرعة."
   ]},
  { h:"مستوى الجهد — أهم من اختيار الموديل أحياناً", items:[
    "حتى داخل نفس الموديل، تقدرين ترفعين أو تخفّضين «الجهد».",
    "جهد عالي: تفكير أعمق، ردود أدق، وقت أطول.",
    "جهد منخفض: رد سريع، مناسب للطلبات الواضحة.",
    "العملي: ابدئي بالافتراضي. إذا الرد سطحي ارفعي الجهد. إذا كان مطوّلاً بلا داعٍ خفّضيه."
   ], tip:"طريقة عملية لتختارين بنفسك: خذي مهمة متوسطة ونفّذيها بموديلين مختلفين. إذا ما لقيتِ فرقاً يستاهل، خلّيك على الأخف والأسرع." },
  { h:"قاعدة الاقتصاد", items:[
    "الموديل الأقوى يستهلك من حدّ استخدامك أسرع.",
    "فاحفظي الأقوى للحظات اللي تحتاج فيها تفكيراً فعلياً، واستخدمي الأخف في الإنتاج اليومي.",
    "وإذا وصلتِ الحد وأنتِ في نص مهمة: اطلبي تلخيص ما وصلتوا له قبل انتهاء الجلسة."
   ]}
 ]
}
];
</script>
<script>
var S={};
try{ S=JSON.parse(localStorage.getItem('claude_path')||'{}'); }catch(e){ S={}; }
function save(){ try{ localStorage.setItem('claude_path',JSON.stringify(S)); }catch(e){} }
var cur=0, view='stage', wcur=0, rcur=0;
var AR=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
function num(n){ return String(n).split('').map(function(d){return AR[+d];}).join(''); }

function totalUnits(){ var t=0; STAGES.forEach(function(s){ t+=s.lessons.length+1; }); return t; }
function doneUnits(){
 var d=0;
 STAGES.forEach(function(s){
  s.lessons.forEach(function(_,i){ if(S[s.id+'_l'+i]) d++; });
  if(S[s.id+'_q']) d++;
 });
 return d;
}
function stageDone(s){
 return s.lessons.every(function(_,i){return S[s.id+'_l'+i];}) && S[s.id+'_q'];
}
function renderNav(){
 var n=document.getElementById('nav'); n.innerHTML='';
 STAGES.forEach(function(s,i){
  var b=document.createElement('button');
  b.className=((view==='stage'&&i===cur)?'on ':'')+(stageDone(s)?'done':'');
  b.innerHTML='<span class="d">'+s.icon+'</span>'+s.title+' — '+s.name;
  b.onclick=function(){ cur=i; view='stage'; render(); window.scrollTo(0,0); };
  n.appendChild(b);
 });
 var w=document.getElementById('wnav'); w.innerHTML='';
 var wh=document.createElement('button');
 wh.className=(view==='wsindex'?'on':'');
 wh.innerHTML='<span class="d">WORKSHOP</span>ورشة التطبيق العملي';
 wh.onclick=function(){ view='wsindex'; render(); window.scrollTo(0,0); };
 w.appendChild(wh);
 WORKSHOP.forEach(function(d,i){
  var b=document.createElement('button');
  b.className=(view==='ws'&&i===wcur?'on':'');
  b.style.fontSize='13.5px'; b.style.paddingRight='26px';
  b.innerHTML='· '+d.name;
  b.onclick=function(){ wcur=i; view='ws'; render(); window.scrollTo(0,0); };
  w.appendChild(b);
 });
 var rv=document.getElementById('rnav'); rv.innerHTML='';
 var rh=document.createElement('button');
 rh.className=(view==='refindex'?'on':'');
 rh.innerHTML='<span class="d">REFERENCE</span>المرجع العملي';
 rh.onclick=function(){ view='refindex'; render(); window.scrollTo(0,0); };
 rv.appendChild(rh);
 REFPAGES.forEach(function(p,i){
  var b=document.createElement('button');
  b.className=(view==='ref'&&i===rcur?'on':'');
  b.style.fontSize='13.5px'; b.style.paddingRight='26px';
  b.innerHTML='· '+p.name;
  b.onclick=function(){ rcur=i; view='ref'; render(); window.scrollTo(0,0); };
  rv.appendChild(b);
 });
 document.getElementById('refsBtn').className=(view==='refs'?'on':'');
 var p=Math.round(doneUnits()/totalUnits()*100);
 document.getElementById('bar').style.width=p+'%';
 document.getElementById('ptxt').textContent=num(p)+'٪ مكتمل';
}
function el(tag,cls,html){ var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }

function renderRefs(){
 var m=document.getElementById('main'); m.innerHTML='';
 m.appendChild(el('div','eyebrow','REFERENCES'));
 m.appendChild(el('h1',null,'المصادر الرسمية'));
 m.appendChild(el('div','goal','كل محتوى هذي المنصة مبني على هذي المصادر الرسمية من أنثروبيك. كلها مجانية وبالإنجليزي.'));
 var L=el('div','reflist');
 REFS.forEach(function(r){
  var a=document.createElement('a'); a.href=r[1]; a.target='_blank'; a.rel='noopener';
  a.innerHTML='<b>'+r[0]+'</b><span>'+r[1].replace(/^https:\/\//,'')+'</span>';
  L.appendChild(a);
 });
 m.appendChild(L);
 m.appendChild(el('div','foot','المحتوى مجموع بتاريخ ١٩ نوفمبر ٢٠٢٦. المنتجات تتغيّر بسرعة — الصفحة الرسمية هي المرجع عند أي اختلاف.'));
 renderNav();
}

function renderWsIndex(){
 var m=document.getElementById('main'); m.innerHTML='';
 m.appendChild(el('div','eyebrow','WORKSHOP'));
 m.appendChild(el('h1',null,'ورشة التطبيق العملي'));
 m.appendChild(el('div','goal','هنا نمشي على كل مجال خطوة بخطوة: تشريح الطلب الجيد، مقارنة بين طلب ضعيف وطلب قوي بنصهما الكامل، خطوات التنفيذ بالترتيب، وأشهر الأخطاء. اختاري مجالاً للبداية.'));
 var g=el('div','ws-grid');
 WORKSHOP.forEach(function(d,i){
  var t=el('button','ws-tile','<span class="ic">'+d.icon+'</span><b>'+d.name+'</b><small>'+d.intro.split('.')[0]+'.</small>');
  t.onclick=function(){ wcur=i; view='ws'; render(); window.scrollTo(0,0); };
  g.appendChild(t);
 });
 m.appendChild(g);
 m.appendChild(el('div','foot','كل مثال هنا مكتوب بالكامل — تقدرين تنسخينه وتعدّلين عليه مباشرة.'));
 renderNav();
}
function renderWs(){
 var d=WORKSHOP[wcur], m=document.getElementById('main'); m.innerHTML='';
 m.appendChild(el('div','eyebrow','ورشة التطبيق · '+d.icon));
 m.appendChild(el('h1',null,d.name));
 m.appendChild(el('div','goal',d.intro));

 var a=el('div','ws-card');
 a.appendChild(el('h2',null,'تشريح الطلب الجيد في هذا المجال'));
 var ul=el('ul','anat');
 d.anatomy.forEach(function(x){ ul.appendChild(el('li',null,x)); });
 a.appendChild(ul);
 m.appendChild(a);

 var c=el('div','ws-card');
 c.appendChild(el('h2',null,'مقارنة: طلب ضعيف مقابل طلب قوي'));
 c.appendChild(el('div','plabel b','✗ ضعيف'));
 c.appendChild(el('div','pbox pbad',d.weak));
 c.appendChild(el('div','plabel g','✓ قوي — انسخيه وعدّلي عليه'));
 c.appendChild(el('div','pbox pgood',d.strong));
 m.appendChild(c);

 var s=el('div','ws-card');
 s.appendChild(el('h2',null,'الخطوات بالترتيب'));
 d.steps.forEach(function(st,i){
  var ln=el('div','stepline');
  ln.appendChild(el('div','stepn',num(i+1)));
  ln.appendChild(el('div',null,'<b>'+st[0]+'</b><span>'+st[1]+'</span>'));
  s.appendChild(ln);
 });
 if(d.tip) s.appendChild(el('div','tip','<b>ملاحظة:</b> '+d.tip));
 m.appendChild(s);

 var e=el('div','err','<b>أخطاء شائعة في هذا المجال</b>');
 var eu=el('ul');
 d.mistakes.forEach(function(x){ eu.appendChild(el('li',null,x)); });
 e.appendChild(eu);
 m.appendChild(e);

 var nx=el('div','next');
 if(wcur>0){ var pb=el('button','btn g','← '+WORKSHOP[wcur-1].name); pb.onclick=function(){wcur--;render();window.scrollTo(0,0);}; nx.appendChild(pb); }
 if(wcur<WORKSHOP.length-1){ var nb=el('button','btn',WORKSHOP[wcur+1].name+' →'); nb.onclick=function(){wcur++;render();window.scrollTo(0,0);}; nx.appendChild(nb); }
 m.appendChild(nx);
 m.appendChild(el('div','foot','المبدأ الثابت في كل المجالات: سياق واضح + مهمة محددة + قيود + معيار جودة.'));
 renderNav();
}
function renderRefIndex(){
 var m=document.getElementById('main'); m.innerHTML='';
 m.appendChild(el('div','eyebrow','REFERENCE'));
 m.appendChild(el('h1',null,'المرجع العملي'));
 m.appendChild(el('div','goal','أربع صفحات مرجعية ترجعين لها وقت الحاجة: كيف تربطين تطبيقاتك بكلاود ومن وين تجيبين الروابط، وش تسوي كل مهارة متاحة لك، كيف تستخدمين الإضافات، ومتى تستخدمين كل موديل.'));
 var g=el('div','ws-grid');
 REFPAGES.forEach(function(p,i){
  var t=el('button','ws-tile','<span class="ic">'+p.icon+'</span><b>'+p.name+'</b><small>'+p.lead.split('.')[0]+'.</small>');
  t.onclick=function(){ rcur=i; view='ref'; render(); window.scrollTo(0,0); };
  g.appendChild(t);
 });
 m.appendChild(g);
 renderNav();
}
function renderRef(){
 var p=REFPAGES[rcur], m=document.getElementById('main'); m.innerHTML='';
 m.appendChild(el('div','eyebrow','المرجع العملي · '+p.icon));
 m.appendChild(el('h1',null,p.name));
 m.appendChild(el('div','goal',p.lead));
 p.blocks.forEach(function(b){
  var c=el('div','ws-card');
  c.appendChild(el('h2',null,b.h));
  if(b.items){ var u=el('ul','anat'); b.items.forEach(function(x){ u.appendChild(el('li',null,x)); }); c.appendChild(u); }
  if(b.steps){ b.steps.forEach(function(st,i){
    var ln=el('div','stepline');
    ln.appendChild(el('div','stepn',num(i+1)));
    ln.appendChild(el('div',null,'<span>'+st+'</span>'));
    c.appendChild(ln);
  }); }
  if(b.note) c.appendChild(el('div','exp',b.note));
  if(b.tip) c.appendChild(el('div','tip','<b>ملاحظة:</b> '+b.tip));
  m.appendChild(c);
 });
 var nx=el('div','next');
 if(rcur>0){ var pb=el('button','btn g','← '+REFPAGES[rcur-1].name); pb.onclick=function(){rcur--;render();window.scrollTo(0,0);}; nx.appendChild(pb); }
 if(rcur<REFPAGES.length-1){ var nb=el('button','btn',REFPAGES[rcur+1].name+' →'); nb.onclick=function(){rcur++;render();window.scrollTo(0,0);}; nx.appendChild(nb); }
 m.appendChild(nx);
 m.appendChild(el('div','foot','صفحات المرجع مبنية على التوثيق الرسمي لأنثروبيك بتاريخ ١٩ نوفمبر ٢٠٢٦.'));
 renderNav();
}
function render(){
 if(view==='refs') return renderRefs();
 if(view==='refindex') return renderRefIndex();
 if(view==='ref') return renderRef();
 if(view==='wsindex') return renderWsIndex();
 if(view==='ws') return renderWs();
 var s=STAGES[cur], m=document.getElementById('main'); m.innerHTML='';
 m.appendChild(el('div','eyebrow',s.title.toUpperCase()+' · '+s.icon));
 m.appendChild(el('h1',null,s.name));
 m.appendChild(el('div','goal','<b>الهدف:</b> '+s.goal));

 s.lessons.forEach(function(L,i){
  var c=el('div','lesson');
  var h=el('div','lhead');
  var left=el('div');
  left.appendChild(el('h2',null,L.t));
  var box=el('div',null,''); box.style.display='flex'; box.style.gap='12px';
  box.appendChild(el('div','lnum',num(i+1)));
  box.appendChild(left);
  h.appendChild(box);
  c.appendChild(h);
  L.body.forEach(function(p){ c.appendChild(el('p',null,p)); });
  if(L.tip) c.appendChild(el('div','tip','<b>ملاحظة:</b> '+L.tip));
  var key=s.id+'_l'+i;
  var b=el('button','mark'+(S[key]?' on':''),S[key]?'✓  تم':'علّمي كمقروء');
  b.onclick=function(){ S[key]=!S[key]; save(); render(); };
  c.appendChild(b);
  m.appendChild(c);
 });

 // quiz
 var qz=el('div','quiz');
 qz.appendChild(el('h2',null,'اختبار '+s.title));
 qz.appendChild(el('div','sub','جاوبي على الأسئلة. كل إجابة تجيك مع شرحها مباشرة.'));
 var state={ans:{}};
 s.quiz.forEach(function(Q,qi){
  var q=el('div','q');
  q.appendChild(el('p','qt',num(qi+1)+'. '+Q.q));
  var opts=[];
  Q.a.forEach(function(txt,oi){
   var o=el('button','opt',txt);
   o.onclick=function(){
    if(state.ans[qi]!==undefined) return;
    state.ans[qi]=oi;
    opts.forEach(function(x,xi){ x.disabled=true; if(xi===Q.c)x.className='opt right'; });
    if(oi!==Q.c) o.className='opt wrong';
    q.appendChild(el('div','exp',(oi===Q.c?'✓ صحيح. ':'✗ الإجابة الصحيحة هي الثانية المظلّلة. ')+Q.e));
    checkScore();
   };
   opts.push(o); q.appendChild(o);
  });
  qz.appendChild(q);
 });
 var sc=el('div','score',''); sc.style.display='none'; qz.appendChild(sc);
 function checkScore(){
  var n=Object.keys(state.ans).length;
  if(n<s.quiz.length) return;
  var right=0; s.quiz.forEach(function(Q,i){ if(state.ans[i]===Q.c) right++; });
  sc.style.display='block';
  sc.innerHTML='نتيجتك: <b>'+num(right)+' من '+num(s.quiz.length)+'</b>'+
   (right===s.quiz.length?' — ممتاز، المرحلة مكتملة.':' — راجعي الدروس المرتبطة بالأسئلة اللي أخطأتِ فيها.');
  S[s.id+'_q']=true; save(); renderNav();
 }
 m.appendChild(qz);

 var P=PRACTICE[s.id];
 if(P){
  var pr=el('div','prac');
  pr.appendChild(el('h2',null,P.title));
  pr.appendChild(el('div','tk',P.task));
  pr.appendChild(el('div',null,'<b style="font-size:14px;color:#7A5415">راقبي هذي النقاط:</b>'));
  var pu=el('ul');
  P.look.forEach(function(x){ pu.appendChild(el('li',null,x)); });
  pr.appendChild(pu);
  pr.appendChild(el('div','lr','<b>الهدف:</b> '+P.learn));
  m.appendChild(pr);
 }

 var nx=el('div','next');
 if(cur>0){ var pb=el('button','btn g','← المرحلة السابقة'); pb.onclick=function(){cur--;render();window.scrollTo(0,0);}; nx.appendChild(pb); }
 if(cur<STAGES.length-1){ var nb=el('button','btn','المرحلة التالية →'); nb.onclick=function(){cur++;render();window.scrollTo(0,0);}; nx.appendChild(nb); }
 m.appendChild(nx);

 if(cur===STAGES.length-1 && doneUnits()===totalUnits()){
  var d=el('div','done-card','<h2>أكملتِ المسار كاملاً</h2><p>خمس مراحل، كل الدروس وكل الاختبارات. الخطوة الجاية: اختاري أكثر مهمة تكررينها وحوّليها لمهارة.</p>');
  d.style.marginTop='30px'; m.appendChild(d);
 }
 m.appendChild(el('div','foot','منصة تعلّم كلاود — مبنية من المصادر الرسمية لأنثروبيك. تقدمك محفوظ في هذا المتصفح.'));
 renderNav();
}
document.getElementById('refsBtn').onclick=function(){ view='refs'; render(); window.scrollTo(0,0); };
render();
</script>
</body>
</html>
